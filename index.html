<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }}</title>
  <style>
    :root {
      --c1: {{ theme.c1 }};
      --c2: {{ theme.c2 }};
      --accent: {{ theme.accent }};
      --bg1: {{ theme.bg1 }};
      --bg2: {{ theme.bg2 }};
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; min-height: 100vh; }
    .app { display: flex; flex-direction: column; height: 100vh; max-width: 780px; margin: 0 auto; }
    header { display: flex; align-items: center; gap: 14px; padding: 16px 20px; }
    .bot-avatar { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; }
    header h1 { font-size: 19px; font-weight: 700; }
    .tagline { font-size: 13px; opacity: 0.85; }
    .status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; opacity: 0.9; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #2ecc71; }
    #chat { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 6px; }
    .msg { max-width: 80%; padding: 11px 15px; border-radius: 16px; line-height: 1.55; font-size: 15px; word-wrap: break-word; animation: pop 0.18s ease; }
    @keyframes pop { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
    .msg.user { align-self: flex-end; color: #fff; border-bottom-right-radius: 5px; }
    .msg.model { align-self: flex-start; border-bottom-left-radius: 5px; }
    .msg code { background: rgba(0, 0, 0, 0.08); padding: 2px 6px; border-radius: 6px; font-size: 13px; font-family: Consolas, monospace; }
    .msg pre { background: #10141f; color: #d7e3ff; padding: 12px 14px; border-radius: 12px; overflow-x: auto; margin: 8px 0; font-size: 13px; font-family: Consolas, monospace; }
    .msg pre code { background: none; padding: 0; }
    .msg.user code { background: rgba(255, 255, 255, 0.18); }
    .msg h4 { margin: 4px 0 2px; }
    .typing { align-self: flex-start; display: none; gap: 5px; padding: 14px 16px; border-radius: 16px; }
    .typing.show { display: flex; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: #9aa1b5; animation: blink 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); } 40% { opacity: 1; transform: scale(1); } }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 20px 10px; }
    .chip { border: 1.5px solid var(--c1); color: var(--c1); background: transparent; padding: 7px 13px; border-radius: 999px; font-size: 12.5px; cursor: pointer; transition: all 0.2s; }
    .chip:hover { background: var(--c1); color: #fff; }
    footer { padding: 8px 20px 14px; }
    form { display: flex; gap: 10px; }
    #input { flex: 1; padding: 13px 16px; border-radius: 14px; border: 1.5px solid #d9dde8; background: #fff; color: #20263a; font-size: 15px; outline: none; transition: border-color 0.2s; }
    #input:focus { border-color: var(--c1); }
    #send { width: 52px; height: 48px; border: none; border-radius: 14px; background: linear-gradient(120deg, var(--c1), var(--c2)); color: #fff; font-size: 17px; cursor: pointer; transition: transform 0.15s, opacity 0.2s; }
    #send:hover { transform: translateY(-1px); }
    #send:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    .disclaimer { text-align: center; font-size: 11.5px; color: #8b91a5; margin-top: 9px; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(120, 130, 150, 0.35); border-radius: 8px; }
    
    body.glass { background: linear-gradient(140deg, var(--bg1), var(--bg2)); color: #e8ebf5; }
    body.glass .app { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(18px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 26px; margin: 26px auto; height: calc(100vh - 52px); overflow: hidden; box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45); }
    body.glass header { color: #fff; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    body.glass .bot-avatar { background: linear-gradient(120deg, var(--c1), var(--c2)); border-radius: 50%; }
    body.glass .msg.user { background: linear-gradient(120deg, var(--c1), var(--c2)); }
    body.glass .msg.model { background: rgba(255, 255, 255, 0.08); color: #e8ebf5; }
    body.glass .typing { background: rgba(255, 255, 255, 0.08); }
    body.glass .typing span { background: #cfd6ea; }
    body.glass .msg code { background: rgba(255, 255, 255, 0.12); }
    body.glass #input { background: rgba(255, 255, 255, 0.07); border-color: rgba(255, 255, 255, 0.15); color: #f2f4fb; }
    body.glass #input::placeholder { color: #9aa3bd; }
    body.glass .disclaimer { color: #8f97b3; }
    @media (max-width: 640px) { body.glass .app { margin: 0; border-radius: 0; height: 100vh; } }
    
    @media (max-width: 640px) {
      .app { max-width: 100%; }
      header { padding: 14px 16px; }
      #chat { padding: 14px 12px; }
      .msg { max-width: 92%; }
      .chips { padding: 2px 14px 8px; }
      footer { padding: 6px 14px 12px; }
    }
  </style>
</head>
<body class="{{ theme.variant }}">
  <div class="app">
    <header>
      <div class="bot-avatar">{{ emoji }}</div>
      <div>
        <h1>{{ title }}</h1>
        <p class="tagline">{{ tagline }}</p>
      </div>
      <span class="status"><span class="dot"></span>Online</span>
    </header>

    <main id="chat"></main>

    <div class="chips" id="chips"></div>

    <footer>
      <form id="form" autocomplete="off">
        <input id="input" type="text" placeholder="Ask anything about {{ domain_short }}..." />
        <button id="send" type="submit" aria-label="Send">&#10148;</button>
      </form>
      <p class="disclaimer">{{ title }} answers only {{ domain_short }} study questions &mdash; anything else gets a polite no.</p>
    </footer>
  </div>

  <script>
    const chatBox = document.getElementById("chat");
    const chipsBox = document.getElementById("chips");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    const greeting = {{ greeting | tojson }};
    const suggestions = {{ suggestions | tojson }};
    let chatHistory = [];
    let busy = false;

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function format(text) {
      let out = escapeHtml(text);
      out = out.replace(/```([\s\S]*?)```/g, function (m, code) {
        return "<pre><code>" + code.replace(/^\n/, "") + "</code></pre>";
      });
      out = out.replace(/`([^`\n]+)`/g, "<code>$1</code>");
      out = out.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
      out = out.replace(/(^|\n)###\s*(.+)/g, "$1<h4>$2</h4>");
      out = out.replace(/\n/g, "<br>");
      return out;
    }

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.innerHTML = format(text);
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showTyping() {
      const div = document.createElement("div");
      div.className = "msg model typing show";
      div.id = "typing";
      div.innerHTML = "<span></span><span></span><span></span>";
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function hideTyping() {
      const t = document.getElementById("typing");
      if (t) t.remove();
    }

    function setBusy(state) {
      busy = state;
      sendBtn.disabled = state;
    }

    async function sendMessage(text) {
      text = text.trim();
      if (!text || busy) return;
      setBusy(true);
      addMessage("user", text);
      chatHistory.push({ role: "user", text: text });
      input.value = "";
      showTyping();
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history: chatHistory.slice(0, -1) })
        });
        const data = await res.json();
        hideTyping();
        const reply = data.reply || data.error || "Sorry, something went wrong. Please try again.";
        addMessage("model", reply);
        chatHistory.push({ role: "model", text: reply });
      } catch (err) {
        hideTyping();
        addMessage("model", "Network error \u2014 please check your connection and try again.");
      } finally {
        setBusy(false);
        input.focus();
      }
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      sendMessage(input.value);
    });

    suggestions.forEach(function (s) {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      chip.textContent = s;
      chip.addEventListener("click", function () { sendMessage(s); });
      chipsBox.appendChild(chip);
    });

    addMessage("model", greeting);
    input.focus();
  </script>
</body>
</html>
